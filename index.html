  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2eee6;color:#26372f}
    .shell{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#fff8e9 0,transparent 35%),radial-gradient(circle at 80% 85%,#dce8df 0,transparent 38%),#eee9df}

    button{width:100%;height:48px;margin-top:13px;border:0;border-radius:12px;background:#315b46;color:white;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.62;cursor:wait}
    .error{min-height:22px;margin-top:12px;color:#a23c32;font-size:14px}.note{margin-top:4px;color:#879089;font-size:12px;line-height:1.6}
    #viewer{display:none;width:100%;height:100%;border:0;background:white}.lock{display:none;position:fixed;right:18px;bottom:18px;z-index:20;width:auto;height:42px;margin:0;padding:0 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

    const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const form=document.getElementById("form"),input=document.getElementById("password"),button=document.getElementById("submit"),error=document.getElementById("error"),login=document.getElementById("login"),viewer=document.getElementById("viewer"),lock=document.getElementById("lock");
    async function unlock(password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(cfg.salt),iterations:cfg.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(cfg.iv),tagLength:128},key,bytes(cfg.payload));
      viewer.srcdoc=new TextDecoder().decode(plain);login.style.display="none";viewer.style.display="block";lock.style.display="block";sessionStorage.setItem("travelUnlocked","1");
    }
    form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";button.disabled=true;button.textContent="正在解锁…";try{await unlock(input.value)}catch(e){error.textContent="密码不正确，请重新输入。";input.select()}finally{button.disabled=false;button.textContent="解锁行程"}});
    lock.addEventListener("click",()=>{viewer.srcdoc="";viewer.style.display="none";lock.style.display="none";login.style.display="grid";input.value="";input.focus();sessionStorage.removeItem("travelUnlocked")});
